<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — Haisam Nadeem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7EAE3; --grid:#D2D8CE; --grid-major:#C2CABD;
    --ink:#131A16; --mute:#6E766F; --copper:#A85B2A;
    --gutter:clamp(20px, 5vw, 72px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    -webkit-font-smoothing:antialiased; min-height:100svh;
  }
  /* drafting-paper grid: 14px minor, 70px major */
  .grid-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px),
      linear-gradient(to right, var(--grid-major) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-major) 1px, transparent 1px);
    background-size:14px 14px, 14px 14px, 70px 70px, 70px 70px;
    opacity:.55;
    mask-image:radial-gradient(120% 100% at 50% 20%, #000 40%, transparent 100%);
    -webkit-mask-image:radial-gradient(120% 100% at 50% 20%, #000 40%, transparent 100%);
  }

  /* the grid lights up in copper around the cursor */
  .grid-lit{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(to right, rgba(168,91,42,.6) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(168,91,42,.6) 1px, transparent 1px),
      linear-gradient(to right, rgba(168,91,42,.9) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(168,91,42,.9) 1px, transparent 1px);
    background-size:14px 14px, 14px 14px, 70px 70px, 70px 70px;
    opacity:0;
    transition:opacity .5s ease;
    mask-image:radial-gradient(circle 220px at var(--mx, -500px) var(--my, -500px),
               #000 0%, rgba(0,0,0,.45) 45%, transparent 75%);
    -webkit-mask-image:radial-gradient(circle 220px at var(--mx, -500px) var(--my, -500px),
               #000 0%, rgba(0,0,0,.45) 45%, transparent 75%);
  }
  .grid-lit.on{ opacity:.45; }

  @media (prefers-reduced-motion:reduce){
    .grid-lit{ display:none; }
  }

  .wrap{ position:relative; z-index:1; padding:var(--gutter); max-width:1300px; margin:0 auto; }

  /* top bar */
  .topbar{
    display:flex; align-items:center; justify-content:center;
    gap:clamp(20px,4vw,52px); flex-wrap:wrap;
    padding-bottom:clamp(24px,4vh,44px);
    border-bottom:1px solid var(--grid-major);
  }
  .back{
    display:inline-flex; align-items:center; gap:12px;
    font-family:"Archivo", sans-serif;
    font-variation-settings:"wdth" 112, "wght" 600;
    font-size:clamp(14px,1.7vw,21px);
    letter-spacing:.02em; text-transform:uppercase;
    color:var(--ink); text-decoration:none;
    padding:8px 0; position:relative;
    transition:color .25s ease, transform .25s ease;
  }
  .back::after{
    content:""; position:absolute; left:0; bottom:0;
    width:100%; height:2px; background:var(--copper);
    transform:scaleX(0); transform-origin:left;
    transition:transform .35s cubic-bezier(.16,.84,.3,1);
  }
  .back:hover, .back:focus-visible{ color:var(--copper); }
  .back:hover::after, .back:focus-visible::after{ transform:scaleX(1); }
  .back svg{ display:block; }
  .pagenav{ display:flex; gap:clamp(16px,3vw,40px); flex-wrap:wrap; align-items:center; }
  .pagenav a{
    font-family:"Archivo", sans-serif;
    font-variation-settings:"wdth" 112, "wght" 600;
    font-size:clamp(14px,1.7vw,21px);
    letter-spacing:.02em; text-transform:uppercase;
    color:var(--ink); text-decoration:none;
    padding:8px 0; position:relative;
    transition:color .25s ease, transform .25s ease;
  }
  .pagenav a::after{
    content:""; position:absolute; left:0; bottom:0;
    width:100%; height:2px; background:var(--copper);
    transform:scaleX(0); transform-origin:left;
    transition:transform .35s cubic-bezier(.16,.84,.3,1);
  }
  .pagenav a:hover, .pagenav a:focus-visible{ color:var(--copper); }
  .pagenav a:hover::after, .pagenav a:focus-visible::after{ transform:scaleX(1); }
  .pagenav a[aria-current]{ color:var(--copper); }
  .pagenav a[aria-current]::after{ transform:scaleX(1); }

  h1{
    font-family:"Archivo", sans-serif;
    font-variation-settings:"wdth" 118, "wght" 680;
    font-size:clamp(2.2rem, 8vw, 6rem);
    line-height:.92; letter-spacing:-.03em;
    margin:clamp(40px,8vh,90px) 0 clamp(36px,6vh,70px);
    text-transform:uppercase;
  }

  .empty-note{
    font-family:"IBM Plex Mono", monospace;
    font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--mute); margin:0;
    padding:clamp(40px,8vh,90px) 0;
    border-top:1px solid var(--grid-major);
  }


  /* nav: slow copper glow, bobble on hover */
  @keyframes navGlow{
    0%, 100% { text-shadow:none; }
    50%      { text-shadow:0 0 8px rgba(168,91,42,.55), 0 0 20px rgba(168,91,42,.28); }
  }
  @keyframes navBobble{
    0%   { transform:translateY(0); }
    30%  { transform:translateY(-6px); }
    55%  { transform:translateY(0); }
    75%  { transform:translateY(-3px); }
    100% { transform:translateY(0); }
  }
  .pagenav a{
    animation:navGlow 4.6s ease-in-out infinite;
    animation-delay:var(--gd, 0s);
  }
  .pagenav > a:nth-child(1){ --gd:0s; }
  .pagenav > a:nth-child(2){ --gd:.9s; }
  .pagenav > a:nth-child(3){ --gd:1.8s; }
  .pagenav > a:nth-child(4){ --gd:2.7s; }
  .pagenav > a:nth-child(5){ --gd:3.6s; }
  .pagenav a:hover, .pagenav a:focus-visible{
    animation:navGlow 4.6s ease-in-out infinite,
              navBobble 1s ease-in-out infinite;
    animation-delay:var(--gd, 0s), 0s;
  }
  @media (prefers-reduced-motion:reduce){
    .pagenav a, .pagenav a:hover, .pagenav a:focus-visible{ animation:none; }
  }


  /* icons: copper glow + hover bobble */
  @keyframes iconGlow{
    0%, 100% { filter:none; }
    50%      { filter:drop-shadow(0 0 5px rgba(168,91,42,.60))
                      drop-shadow(0 0 14px rgba(168,91,42,.30)); }
  }
  .back{
    animation:iconGlow 4.6s ease-in-out infinite;
  }
  .back:hover, .back:focus-visible{
    animation:iconGlow 4.6s ease-in-out infinite,
              navBobble 1s ease-in-out infinite;
  }
  @media (prefers-reduced-motion:reduce){
    .back, .back:hover, .back:focus-visible{ animation:none; }
  }

  a:focus-visible{ outline:2px solid var(--copper); outline-offset:4px; }

  footer.pagefoot{
    margin-top:clamp(60px,12vh,120px);
    padding-top:24px; border-top:1px solid var(--grid-major);
    display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute);
  }
  footer.pagefoot a{ color:var(--mute); text-decoration:none; }
  footer.pagefoot a:hover{ color:var(--copper); }

  /* swivel on scroll */
  .swivel{
    transform-origin:50% 100%;
    transform:perspective(1200px) rotateX(var(--sw-x,0deg)) translateY(var(--sw-y,0px));
    opacity:var(--sw-o,1); will-change:transform,opacity;
  }
  .js .swivel{ --sw-x:26deg; --sw-y:34px; --sw-o:0; }

  @media (prefers-reduced-motion:reduce){
    .js .swivel{ --sw-x:0deg; --sw-y:0px; --sw-o:1; }
  }


</style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div class="grid-lit" aria-hidden="true"></div>

<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html" aria-label="Back to home">
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" focusable="false">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
              d="M3.2 10.6 12 3.4l8.8 7.2M5.6 9v11h12.8V9"/>
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
              d="M9.8 20v-5.6h4.4V20"/>
      </svg>
      <span class="back-label">Home</span>
    </a>
    <nav class="pagenav" aria-label="Sections">
      <a href="experience.html">Industry Experience</a>
      <a href="projects.html" aria-current="page">Projects</a>
    </nav>
  </div>

  <h1>Projects</h1>

  <p class="empty-note">Coming soon.</p>

  <footer class="pagefoot">
    <span>&copy; 2026 Haisam Nadeem</span>
    <a href="index.html">Back to home</a>
  </footer>
</div>

<script>
document.documentElement.classList.add('js');
(function(){
  const items = Array.from(document.querySelectorAll('.swivel'));
  if (!items.length) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const MAX_X = 26, MAX_Y = 34;
  let ticking = false;
  const ease = t => 1 - Math.pow(1 - t, 3);
  function update(){
    ticking = false;
    const vh = window.innerHeight;
    for (const el of items){
      const r = el.getBoundingClientRect();
      let p = (vh - r.top) / (vh * 0.55);
      p = Math.min(1, Math.max(0, p));
      const e = ease(p);
      el.style.setProperty('--sw-x', ((1 - e) * MAX_X).toFixed(2) + 'deg');
      el.style.setProperty('--sw-y', ((1 - e) * MAX_Y).toFixed(1) + 'px');
      el.style.setProperty('--sw-o', Math.min(1, e * 1.5).toFixed(3));
    }
  }
  window.addEventListener('scroll', () => { if(!ticking){ ticking = true; requestAnimationFrame(update); } }, {passive:true});
  window.addEventListener('resize', update);
  update();
})();


// ---- grid lights up around the cursor ----
(function(){
  const lit = document.querySelector('.grid-lit');
  if (!lit) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  let tx = 0, ty = 0, cx = 0, cy = 0, active = false, running = false;

  function loop(){
    cx += (tx - cx) * 0.14;
    cy += (ty - cy) * 0.14;
    lit.style.setProperty('--mx', cx.toFixed(1) + 'px');
    lit.style.setProperty('--my', cy.toFixed(1) + 'px');
    if (Math.abs(tx - cx) > 0.3 || Math.abs(ty - cy) > 0.3){
      requestAnimationFrame(loop);
    } else {
      running = false;
    }
  }

  window.addEventListener('mousemove', ev => {
    tx = ev.clientX; ty = ev.clientY;
    if (!active){
      active = true;
      cx = tx; cy = ty;
      lit.classList.add('on');
    }
    if (!running){ running = true; requestAnimationFrame(loop); }
  }, { passive:true });

  window.addEventListener('mouseleave', () => {
    active = false;
    lit.classList.remove('on');
  });
})();
</script>
</body>
</html>
